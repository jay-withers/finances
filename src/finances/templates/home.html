{% extends "base.html" %}
{% block subtitle %}{{ today.strftime('%-d %B %Y') }}{% endblock %}
{% block nav %}{% endblock %}
{% block body %}
<style>
  /* Each area as a tile. Two across on a phone, so all seven fit on one
     screen; Today spans the row because it is the one to read first. */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .tile { display: block; text-decoration: none; color: var(--text);
          background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 12px 14px; min-height: 92px; }
  .tile:first-child { grid-column: 1 / -1; min-height: 0; }
  .tile:hover, .tile:focus-visible { border-color: var(--dim); }
  .tile .label { color: var(--dim); font-size: 12px; text-transform: uppercase;
                 letter-spacing: .08em; }
  .tile .value { font-size: 19px; font-weight: 600; letter-spacing: -0.01em;
                 margin-top: 2px; line-height: 1.3; }
  .tile .detail { color: var(--dim); font-size: 13px; margin-top: 2px; }
  /* State is a coloured edge beside words that already say it, never the
     colour alone. */
  .tile.warn { border-left: 3px solid var(--warn); }
  .tile.urgent { border-left: 3px solid var(--bad); }
  .tile.urgent .detail, .tile.warn .detail { color: var(--text); }
</style>

<div class="tiles">
  {% for t in tiles %}
    <a class="tile {{ t.state }}" href="{{ t.href }}">
      <div class="label">{{ t.title }}</div>
      <div class="value">{{ t.value }}</div>
      {% if t.detail %}<div class="detail">{{ t.detail }}</div>{% endif %}
    </a>
  {% endfor %}
</div>

<form method="post" action="/logout"><button class="ghost" type="submit">Log out</button></form>
{% endblock %}
