{% macro purpose_field(current) %}
  <div class="field">
    <label for="purpose">What it's for</label>
    <select id="purpose" name="purpose">
      <option value="savings" {{ 'selected' if current == 'savings' }}>Savings</option>
      <option value="bills" {{ 'selected' if current == 'bills' }}>Bills (put by for a known bill, like a card cleared monthly)</option>
      <option value="debt" {{ 'selected' if current == 'debt' }}>Debt (paying something off)</option>
    </select>
  </div>
{% endmacro %}
