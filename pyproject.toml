[project]
name = "finances"
version = "0.1.0"
description = "Household finance tracker: savings pots, recurring commitments, renewals and wealth"
requires-python = ">=3.12"

# One package, one image, five entrypoints (serve, import, seed, show, digest).
# They share the model, the store and the derived calculations, so splitting
# them would mean several builds of near-identical layers.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "jinja2>=3.1",
  # FastAPI's Form() parsing needs it, and the failure without it is a 500 at
  # the first login rather than anything at import time.
  "python-multipart>=0.0.20",
  # The digest posts to Resend. httpx rather than requests because the Azure
  # SDKs already pull it in.
  "httpx>=0.28",
  "azure-identity>=1.19",
  "azure-keyvault-secrets>=4.9",
  "azure-storage-blob>=12.24",
  "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
# openpyxl is here rather than in `dependencies`: the spreadsheet import is a
# one-off run from a laptop, and the runtime image has no reason to carry a
# parser for a file format it never sees.
#
# httpx2, not httpx: starlette's TestClient deprecated the latter, and with
# `filterwarnings = ["error"]` below that deprecation fails collection outright.
# The runtime still depends on plain httpx for the Resend call — TestClient
# picks httpx2 when both are present, which is why both can coexist.
dev = ["pytest>=8.3", "ruff>=0.8", "httpx2>=0.28", "openpyxl>=3.1"]

# What the Dockerfile's ENTRYPOINT resolves to. Terraform sets no `command`, so
# this name lives in exactly one place.
[project.scripts]
finances = "finances.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finances"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Cookie", "fastapi.Depends", "fastapi.Form",
  "fastapi.Header", "fastapi.Path", "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Warnings are errors, so a deprecation in a dependency is seen on the bump
  # that introduced it rather than on the release that removes the feature.
  "error",
  # Raised inside starlette's own TestClient import, not by anything here.
  # gym-log and market-agent carry the identical ignore for the identical reason.
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]
